name: Scheduled AI Visibility Scan

on:
  schedule:
    # Run every Monday at 09:00 UTC (Weekly free cron)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Maximum API calls cap'
        required: false
        default: '30'

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Headless Visibility Scan
        env:
          # Database connection (SQLite or hosted free Turso/Supabase)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
          # Provider API keys from GitHub Secrets
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ secrets.OPENROUTER_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: ${{ secrets.GROQ_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ secrets.GEMINI_MODELS }}
          
          # Analyzer model
          ANALYZER_MODEL: ${{ secrets.ANALYZER_MODEL }}
          MAX_CALLS_PER_SESSION: ${{ github.event.inputs.max_calls || '30' }}
        run: |
          python scripts/run_scan.py --max-calls ${{ github.event.inputs.max_calls || 30 }}
